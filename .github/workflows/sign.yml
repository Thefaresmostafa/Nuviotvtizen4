name: Auto Fetch and Sign Nuvio WGT

on:
  workflow_dispatch: # يتيح لك تشغيل التوقيع بضغطة زر واحدة يدوياً

jobs:
  download-and-sign:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. تحميل أحدث ملف WGT غير موقع مباشرة من صفحة Releases التطبيق
      - name: Fetch Unsigned WGT
        run: |
          curl -L -o nuvio_unsigned.wgt https://github.com/NuvioMedia/NuvioTVSmart/releases
      # 2. إعداد بيئة تايزن
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Tizen CLI Tools
        run: npm install -g tizen-tv-cli

      # 3. دمج شهادتك الرسمية من الإعدادات
      - name: Setup Certificate Profile
        run: |
          echo "${{ secrets.AUTHOR_CERT }}" > author.cer
          tizen security-profiles add -n MyProfile -a author.cer -p "${{ secrets.AUTHOR_PASSWORD }}"

      # 4. توقيع الملف تلقائياً
      - name: Sign WGT Package
        run: tizen package -t wgt -s MyProfile -- nuvio_unsigned.wgt

      # 5. إخراج الملف الموقع لتحميله فوراً
      - name: Upload Signed WGT
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-TV-Signed-Tizen4
          path: 'nuvio_unsigned.wgt'
