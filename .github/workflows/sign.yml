name: Auto Fetch and Sign Nuvio WGT

on:
  workflow_dispatch: # تشغيل يدوي بضغطة زر

# إعطاء الصلاحيات الكاملة للسيرفر لقراءة الملفات والتعامل مع الـ Artifacts بأمان
permissions:
  contents: write
  actions: write

jobs:
  download-and-sign:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. قراءة صفحة الـ Releases تلقائياً وسحب رابط أحدث ملف WGT غير موقع
      - name: Fetch Latest WGT Link from Releases
        run: |
          LATEST_WGT_URL=$(curl -s https://github.com | grep "browser_download_url.*wgt" | head -n 1 | cut -d '"' -f 4)
          
          if [ -z "$LATEST_WGT_URL" ]; then
            LATEST_WGT_URL="https://github.com"
          fi
          
          echo "Downloading from: $LATEST_WGT_URL"
          curl -L -o nuvio_unsigned.wgt "$LATEST_WGT_URL"

      # 2. تجهيز ملف الشهادة الرقمية الخاصة بك داخل السيرفر
      - name: Prepare Certificate File
        run: |
          echo "${{ secrets.AUTHOR_CERT }}" > author.cer

      # 3. توقيع ملف الـ WGT عبر حاوية Docker المستقرة لتايزن
      - name: Sign WGT Package via Tizen Docker Container
        run: |
          docker run --rm -v $(pwd):/workspace -w /workspace hu553in/tizen-tool:latest sh -c "
            tizen security-profiles add -n MyProfile -a author.cer -p '${{ secrets.AUTHOR_PASSWORD }}' &&
            tizen package -t wgt -s MyProfile -- nuvio_unsigned.wgt
          "

      # 4. رفع وتصدير ملف الـ WGT النهائي الموقع والجاهز للتثبيت
      - name: Upload Signed WGT
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-TV-Latest-Signed
          path: 'nuvio_unsigned.wgt'
