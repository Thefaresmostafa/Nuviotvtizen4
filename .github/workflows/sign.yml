name: Sign Tizen WGT File

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sign-wgt:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # إعداد بيئة Node.js لتشغيل أدوات التوقيع السريعة
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # تثبيت أداة التوقيع الرسمية من تايزن عبر حزم npm أونلاين
      - name: Install Tizen CLI Tools
        run: npm install -g tizen-tv-cli

      # تهيئة الشهادة الرسمية وتجهيز الملف السري للتوقيع
      - name: Setup Certificate Profile
        run: |
          echo "${{ secrets.AUTHOR_CERT }}" > author.cer
          tizen security-profiles add -n MyProfile -a author.cer -p "${{ secrets.AUTHOR_PASSWORD }}"

      # البحث عن ملف الـ WGT المرفوع وتوقيعه فوراً
      - name: Sign WGT Package
        run: |
          WGT_FILE=$(find . -name "*.wgt" -type f | head -n 1)
          if [ -z "$WGT_FILE" ]; then
            echo "Error: Please upload your .wgt file to the repository first!" && exit 1
          fi
          tizen package -t wgt -s MyProfile -- "$WGT_FILE"

      # رفع الملف الموقع لتقوم بتحميله إلى جهازك
      - name: Upload Signed WGT as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-wgt-files
          path: '**/*.wgt'
          retention-days: 30
