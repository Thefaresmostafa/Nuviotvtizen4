name: Auto Generate Cert and Sign WGT

on:
  workflow_dispatch: # تشغيل يدوي بضغطة زر

permissions:
  contents: write
  actions: write

jobs:
  generate-and-sign:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. جلب أحدث إصدار مستقر من حزمة التطبيق الرسمية لتايزن
      - name: Fetch Latest WGT Link from Releases
        run: |
          LATEST_WGT_URL=$(curl -s https://github.com | grep "browser_download_url.*wgt" | head -n 1 | cut -d '"' -f 4)
          if [ -z "$LATEST_WGT_URL" ]; then
            LATEST_WGT_URL="https://github.com"
          fi
          echo "Downloading from: $LATEST_WGT_URL"
          curl -L -o nuvio_unsigned.wgt "$LATEST_WGT_URL"

      # 2. إنشاء شهادة تايزن في المسار الصحيح وتوقيع الملف مباشرة
      - name: Create New Certificate and Sign
        run: |
          docker run --rm -v $(pwd):/workspace -w /workspace vitalets/tizen-webos-sdk:latest sh -c "
            # إنشاء الشهادة
            tizen certificate -a Fares -p MyPassword123 -f MyNewCert &&
            
            # نقل ملف الشهادة إلى المجلد الحالي لتراها الأداة
            cp /home/developer/tizen-studio-data/keystore/author/MyNewCert.p12 . &&
            
            # تسجيل الشهادة في النظام
            tizen security-profiles add -n NewProfile -a MyNewCert.p12 -p MyPassword123 &&
            
            # توقيع ملف الـ WGT فوراً
            tizen package -t wgt -s NewProfile -- nuvio_unsigned.wgt
          "

      # 3. رفع وتصدير ملف الـ WGT النهائي الموقع الجاهز لتلفزيونك
      - name: Upload Signed WGT
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-TV-Ready-To-Install
          path: 'nuvio_unsigned.wgt'
