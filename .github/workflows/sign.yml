name: Auto Fetch and Sign Nuvio WGT

on:
  workflow_dispatch: # تشغيل يدوي بضغطة زر

jobs:
  download-and-sign:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. تثبيت الحزم المتوافقة مع Ubuntu الحديث لتشغيل أدوات سامسونج
      - name: Install Official Tizen CLI
        run: |
          sudo apt update
          sudo apt install -y pciutils zip libncurses6 libncursesw6
          curl -L http://tizen.org -o install.bin
          chmod a+x install.bin
          # التثبيت في المسار الصامت لتجنب النوافذ التفاعلية
          ./install.bin --accept-license ~/tizen-studio-cli
          echo "~/tizen-studio-cli/tools/ide/bin" >> $GITHUB_PATH

      # 2. تحميل ملف الـ WGT غير الموقع الخاص بتطبيق Nuvio TV
      - name: Fetch Unsigned WGT
        run: |
          curl -L -o nuvio_unsigned.wgt https://github.com/NuvioMedia/NuvioTVSmart/releases

      # 3. تهيئة ملف الشهادة الخاصة بك وتجهيزها للتوقيع
      - name: Setup Certificate Profile
        run: |
          echo "${{ secrets.AUTHOR_CERT }}" > author.cer
          ~/tizen-studio-cli/tools/ide/bin/tizen security-profiles add -n MyProfile -a author.cer -p "${{ secrets.AUTHOR_PASSWORD }}"

      # 4. توقيع ملف الـ WGT تلقائياً
      - name: Sign WGT Package
        run: |
          ~/tizen-studio-cli/tools/ide/bin/tizen package -t wgt -s MyProfile -- nuvio_unsigned.wgt

      # 5. إخراج ملف الـ WGT الموقع والجاهز للتحميل
      - name: Upload Signed WGT
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-TV-Signed-Tizen4
          path: 'nuvio_unsigned.wgt'
