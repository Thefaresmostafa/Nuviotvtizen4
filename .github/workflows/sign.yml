name: Auto Generate Cert and Sign Nuvio WGT

on:
  workflow_dispatch: # تشغيل يدوي بضغطة زر واحدة

permissions:
  contents: write
  actions: write

jobs:
  generate-and-sign:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. تحميل ملف الـ WGT المخصص لتايزن إصدار 1.0.1 بالرابط الذي حددته
      - name: Fetch Selected Nuvio Tizen WGT
        run: |
          curl -L -o nuvio_unsigned.wgt https://github.com/NuvioMedia/NuvioTVSmart/releases/download/1.0.1/NuvioTV-Tizen-1.0.1.wgt

      # 2. إنشاء شهادة تايزن في المسار الصحيح وتوقيع الملف مباشرة
      - name: Create New Certificate and Sign
        run: |
          docker run --rm -v $(pwd):/workspace -w /workspace vitalets/tizen-webos-sdk:latest sh -c "
            # إنشاء الشهادة الرقمية لتايزن
            tizen certificate -a Fares -p MyPassword123 -f MyNewCert &&
            
            # نقل ملف الشهادة المحدث إلى مجلد العمل الحالي
            cp /home/developer/tizen-studio-data/keystore/author/MyNewCert.p12 . &&
            
            # تسجيل الشهادة الجديدة ضمن الملفات التعريفية لأداة سامسونج
            tizen security-profiles add -n NewProfile -a MyNewCert.p12 -p MyPassword123 &&
            
            # التوقيع الرقمي الفوري لملف التطبيق
            tizen package -t wgt -s NewProfile -- nuvio_unsigned.wgt
          "

      # 3. تصدير ورفع ملف الـ WGT النهائي الموقّع بنجاح لتنزيله
      - name: Upload Signed WGT
        uses: actions/upload-artifact@v4
        with:
          name: NuvioTV-Tizen-1.0.1-Signed
          path: 'nuvio_unsigned.wgt'
